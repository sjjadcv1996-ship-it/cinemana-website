<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - منصة الأفلام والمسلسلات</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Cairo Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914;
            --primary-hover: #f40612;
            --bg-main: #0b0c10;
            --bg-card: #141821;
            --bg-card-hover: #1f2833;
            --text-main: #ffffff;
            --text-muted: #a0a5b1;
            --rating-gold: #f1c40f;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(11, 12, 16, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
            transition: transform 0.2s ease;
        }

        .logo:hover {
            transform: scale(1.03);
        }

        .search-box {
            position: relative;
            width: 320px;
            max-width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 10px 42px 10px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.4);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .genres-bar {
            display: flex;
            gap: 10px;
            padding: 20px 5% 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .genres-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .genre-btn:hover, .genre-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }

        .container {
            padding: 20px 5%;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            border-right: 5px solid var(--primary-color);
            padding-right: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 22px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--bg-card-hover);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(229, 9, 20, 0.2);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%; /* Aspect Ratio 2:3 */
            background: #1a1e29;
            overflow: hidden;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .poster-wrapper img {
            transform: scale(1.08);
        }

        /* Overlay Play Icon on Hover */
        .poster-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .poster-overlay i {
            font-size: 3rem;
            color: var(--primary-color);
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .movie-card:hover .poster-overlay {
            opacity: 1;
        }

        .movie-card:hover .poster-overlay i {
            transform: scale(1);
        }

        .badge-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            color: var(--rating-gold);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .movie-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .movie-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .movie-year {
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 5px;
        }

        .quality-tag {
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 800;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            max-width: 950px;
            margin: 30px auto;
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 1.3rem;
            color: #fff;
            cursor: pointer;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn:hover {
            background: var(--primary-color);
            transform: rotate(90deg);
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details {
            padding: 25px;
        }

        .server-selector {
            display: flex;
            gap: 10px;
            margin: 15px 0 20px;
            flex-wrap: wrap;
        }

        .server-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-btn.active, .server-btn:hover {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loading i {
            font-size: 2.5rem;
            color: var(--primary-color);
        }

        /* Responsiveness */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 4%;
            }

            .search-box {
                width: 100%;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }

            .poster-wrapper {
                padding-top: 145%;
            }

            .movie-title {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" id="logoBtn">
            <i class="fas fa-play-circle"></i> سينمانا
        </a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل...">
        </div>
    </header>

    <div class="genres-bar" id="genresBar">
        <button class="genre-btn active" data-id="all">الكل</button>
        <button class="genre-btn" data-id="28">أكشن</button>
        <button class="genre-btn" data-id="35">كوميديا</button>
        <button class="genre-btn" data-id="18">دراما</button>
        <button class="genre-btn" data-id="27">رعب</button>
        <button class="genre-btn" data-id="878">خيال علمي</button>
        <button class="genre-btn" data-id="10749">رومانسي</button>
        <button class="genre-btn" data-id="16">أنيميشن</button>
        <button class="genre-btn" data-id="53">إثارة</button>
    </div>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">
                <i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام الشائعة
            </h2>
        </div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">
                <i class="fas fa-circle-notch fa-spin"></i>
                <span>جاري تحميل مكتبة الأفلام...</span>
            </div>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal"><i class="fas fa-times"></i></span>
            <div class="video-container">
                <iframe id="videoIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            <div class="player-details">
                <h2 id="modalTitle" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">عنوان الفيلم</h2>
                <div class="server-selector" id="serverSelector">
                    <button class="server-btn active" onclick="changeServer(1)"><i class="fas fa-server"></i> سيرفر Vidsrc</button>
                    <button class="server-btn" onclick="changeServer(2)"><i class="fas fa-server"></i> سيرفر 2Embed</button>
                    <button class="server-btn" onclick="changeServer(3)"><i class="fas fa-server"></i> سيرفر AutoEmbed</button>
                </div>
                <p id="modalOverview" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.7;"></p>
            </div>
        </div>
    </div>

    <script>
        // مفتاح TMDB الخاص بك والمعتمد
        const API_KEY = '4b93e22787e9bcf9d672b62daaedfceb';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t500';

        // صورة بوستر احتياطية جذابة وعالية الجودة في حال عدم توفر غلاف أو وجود رابط مكسور
        function getFallbackPosterSVG(title) {
            const encodedTitle = encodeURIComponent(title || 'سينمانا');
            return `https://placehold.co/500x750/141821/e50914?text=${encodedTitle}`;
        }

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const genresBar = document.getElementById('genresBar');
        const sectionTitle = document.getElementById('sectionTitle');
        const videoModal = document.getElementById('videoModal');
        const closeModal = document.getElementById('closeModal');
        const videoIframe = document.getElementById('videoIframe');
        const modalTitle = document.getElementById('modalTitle');
        const modalOverview = document.getElementById('modalOverview');
        const logoBtn = document.getElementById('logoBtn');

        let currentMovieId = null;

        // 1. جلب البيانات من TMDB مع دعم التعافي التلقائي من الأخطاء
        async function getMovies(endpoint) {
            try {
                moviesGrid.innerHTML = `
                    <div class="loading">
                        <i class="fas fa-circle-notch fa-spin"></i>
                        <span>جاري التحميل...</span>
                    </div>`;
                
                const url = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA`;
                const res = await fetch(url);
                
                if (!res.ok) throw new Error('فشل الاستجابة من السيرفر');
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    displayMovies(data.results);
                } else {
                    // محاولة الجلب باللغة الإنجليزية في حال خلو اللغة العربية من نتائج
                    const fallbackUrl = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=en-US`;
                    const fallbackRes = await fetch(fallbackUrl);
                    const fallbackData = await fallbackRes.json();
                    
                    if (fallbackData.results && fallbackData.results.length > 0) {
                        displayMovies(fallbackData.results);
                    } else {
                        moviesGrid.innerHTML = '<div class="loading"><i class="fas fa-film"></i><span>لم يتم العثور على أية أفلام حالياً.</span></div>';
                    }
                }
            } catch (error) {
                console.error('API Error:', error);
                moviesGrid.innerHTML = '<div class="loading"><i class="fas fa-exclamation-triangle" style="color: var(--primary-color);"></i><span>حدث خطأ في تحميل البيانات. يُرجى التحديث.</span></div>';
            }
        }

        // 2. عرض بطاقات الأفلام مع الصورة الاحتياطية وإصلاح الروابط المكسورة
        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            movies.forEach(movie => {
                const title = movie.title || movie.name || 'فيلم سينمانا';
                
                // التأكد من مسار البوستر مع استخدام بروتوكول HTTPS
                let posterSrc = movie.poster_path 
                    ? `${IMG_URL}${movie.poster_path}`
                    : getFallbackPosterSVG(title);

                const releaseYear = (movie.release_date || movie.first_air_date || '').split('-')[0] || '2025';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '7.5';

                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <span class="badge-rating"><i class="fas fa-star"></i> ${rating}</span>
                        <img src="${posterSrc}" 
                             alt="${title}" 
                             loading="lazy" 
                             onerror="this.onerror=null; this.src='${getFallbackPosterSVG(title)}';">
                        <div class="poster-overlay">
                            <i class="fas fa-play-circle"></i>
                        </div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title" title="${title}">${title}</div>
                        <div class="movie-meta">
                            <span class="movie-year">${releaseYear}</span>
                            <span class="quality-tag">FHD</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openPlayer(movie));
                moviesGrid.appendChild(card);
            });
        }

        // 3. فتح نافذة المشغل للتفاعل والتشغيل
        function openPlayer(movie) {
            currentMovieId = movie.id;
            modalTitle.textContent = movie.title || movie.name;
            modalOverview.textContent = movie.overview || 'لا يوجد وصف متاح لهذا الفيلم حالياً باللغة العربية.';
            
            changeServer(1);
            videoModal.style.display = 'block';
            document.body.style.overflow = 'hidden'; // منع السكرول أثناء مشاهدة الفيلم
        }

        // 4. التبديل بين سيرفرات العرض والتشغيل
        function changeServer(serverNum) {
            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === (serverNum - 1));
            });

            if (serverNum === 1) {
                videoIframe.src = `https://vidsrc.cc/v2/embed/movie/${currentMovieId}`;
            } else if (serverNum === 2) {
                videoIframe.src = `https://www.2embed.cc/embed/${currentMovieId}`;
            } else if (serverNum === 3) {
                videoIframe.src = `https://player.autoembed.cc/embed/movie/${currentMovieId}`;
            }
        }

        // إغلاق النافذة المنبثقة للفيلم
        closeModal.addEventListener('click', closePlayerModal);
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) closePlayerModal();
        });

        function closePlayerModal() {
            videoModal.style.display = 'none';
            videoIframe.src = '';
            document.body.style.overflow = 'auto';
        }

        // 5. البحث الفوري مع الترقب (Debounce)
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();

            searchTimeout = setTimeout(() => {
                if (query.length > 1) {
                    sectionTitle.innerHTML = `<i class="fas fa-search" style="color: var(--primary-color);"></i> نتائج البحث عن: ${query}`;
                    getMovies(`/search/movie?query=${encodeURIComponent(query)}`);
                } else if (query.length === 0) {
                    sectionTitle.innerHTML = `<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام الشائعة`;
                    getMovies('/movie/popular');
                }
            }, 500);
        });

        // 6. الفلترة والتصنيفات
        genresBar.addEventListener('click', (e) => {
            if (e.target.classList.contains('genre-btn')) {
                document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                const genreId = e.target.getAttribute('data-id');
                if (genreId === 'all') {
                    sectionTitle.innerHTML = `<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام الشائعة`;
                    getMovies('/movie/popular');
                } else {
                    sectionTitle.innerHTML = `<i class="fas fa-film" style="color: var(--primary-color);"></i> أفلام ${e.target.textContent}`;
                    getMovies(`/discover/movie?with_genres=${genreId}`);
                }
            }
        });

        // العودة للرئيسية عند الضغط على اللوجو
        logoBtn.addEventListener('click', (e) => {
            e.preventDefault();
            searchInput.value = '';
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.genre-btn[data-id="all"]').classList.add('active');
            sectionTitle.innerHTML = `<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام الشائعة`;
            getMovies('/movie/popular');
        });

        // التشغيل المبدئي للتحميل الأول
        getMovies('/movie/popular');
    </script>
</body>
</html>
