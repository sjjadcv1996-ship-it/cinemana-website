<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - مشغل سينمائي</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914;
            --primary-hover: #b9090b;
            --bg-main: #141414;
            --bg-card: #1f1f1f;
            --bg-card-hover: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-gold: #ffb400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 4%;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0) 100%);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            transition: background 0.3s ease;
        }

        header.scrolled {
            background: #141414;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 40px 9px 15px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #fff;
            background: rgba(0, 0, 0, 0.9);
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Categories Bar */
        .genres-bar {
            display: flex;
            gap: 10px;
            padding: 90px 4% 15px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .genres-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .genre-btn:hover, .genre-btn.active {
            background: #fff;
            color: #000;
            font-weight: 700;
        }

        /* Main Container */
        .container {
            padding: 10px 4% 50px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%;
            background: #222;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent-gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .play-hover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-hover i {
            font-size: 2.8rem;
            color: #fff;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .movie-card:hover .play-hover {
            opacity: 1;
        }

        .movie-info {
            padding: 10px;
        }

        .movie-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Fullscreen Netflix Player Modal */
        .netflix-player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            overflow: hidden;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Custom Netflix Overlay Controls */
        .player-controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 40px;
            opacity: 0;
            transition: opacity 0.3s ease;
            cursor: default;
        }

        .player-wrapper:hover .player-controls-overlay,
        .player-controls-overlay.show {
            opacity: 1;
        }

        /* Top Header in Player */
        .player-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.2);
            color: var(--primary-color);
        }

        .player-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }

        /* Center Play/Pause Indicator */
        .center-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .center-play-btn:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Bottom Controls Bar */
        .player-bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .time-display {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ccc;
            min-width: 50px;
            direction: ltr;
        }

        .seek-bar {
            flex-grow: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .seek-bar:hover {
            height: 8px;
        }

        .seek-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-color);
            border-radius: 5px;
            position: relative;
        }

        .seek-handle {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: none;
        }

        .seek-bar:hover .seek-handle {
            display: block;
        }

        .control-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .ctrl-btn:hover {
            color: var(--primary-color);
            transform: scale(1.15);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .server-tag {
            background: rgba(229, 9, 20, 0.2);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .load-more-btn {
            display: block;
            margin: 30px auto;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        .load-more-btn:hover {
            background: var(--primary-hover);
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .player-controls-overlay {
                padding: 15px 20px;
            }
            .player-title {
                font-size: 1.1rem;
            }
            .center-play-btn {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
            .controls-left, .controls-right {
                gap: 14px;
            }
            .ctrl-btn {
                font-size: 1.1rem;
            }
            .volume-slider {
                width: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header id="mainHeader">
        <a href="#" class="logo"><i class="fas fa-play-circle"></i> سينمانا</a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
        </div>
    </header>

    <!-- Categories -->
    <div class="genres-bar" id="genresBar">
        <button class="genre-btn active" data-id="all">الكل</button>
        <button class="genre-btn" data-id="28">أكشن</button>
        <button class="genre-btn" data-id="35">كوميديا</button>
        <button class="genre-btn" data-id="18">دراما</button>
        <button class="genre-btn" data-id="27">رعب</button>
        <button class="genre-btn" data-id="878">خيال علمي</button>
        <button class="genre-btn" data-id="10749">رومانسي</button>
        <button class="genre-btn" data-id="16">أنيميشن</button>
    </div>

    <!-- Main Movies Grid -->
    <div class="container">
        <div class="section-title" id="sectionTitle">
            <i class="fas fa-fire" style="color: var(--primary-color);"></i> الأكثر مشاهدة الان
        </div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i> جاري إعداد مكتبة الأفلام...
            </div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn">عرض المزيد من الأفلام</button>
    </div>

    <!-- Fullscreen Netflix Player -->
    <div class="netflix-player-modal" id="netflixPlayer">
        <div class="player-wrapper" id="playerWrapper">
            <!-- HTML5 Video Stream -->
            <video id="videoElement" preload="metadata" crossorigin="anonymous">
                <source id="videoSource" src="" type="video/mp4">
                متصفحك لا يدعم تشغيل هذا الفيديو.
            </video>

            <!-- Custom Netflix Overlay -->
            <div class="player-controls-overlay" id="controlsOverlay">
                <!-- Header Controls -->
                <div class="player-header">
                    <button class="back-btn" id="closePlayerBtn" title="إغلاق والعودة"><i class="fas fa-arrow-right"></i></button>
                    <div class="player-title" id="playerMovieTitle">اسم الفيلم</div>
                </div>

                <!-- Center Play Button -->
                <div class="center-play-btn" id="centerPlayBtn">
                    <i class="fas fa-play" id="centerPlayIcon"></i>
                </div>

                <!-- Bottom Bar -->
                <div class="player-bottom-controls">
                    <!-- Progress / Seek Bar -->
                    <div class="progress-container">
                        <span class="time-display" id="currentTime">00:00</span>
                        <div class="seek-bar" id="seekBar">
                            <div class="seek-fill" id="seekFill">
                                <div class="seek-handle"></div>
                            </div>
                        </div>
                        <span class="time-display" id="durationTime">00:00</span>
                    </div>

                    <!-- Button Controls -->
                    <div class="control-buttons">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="playPauseBtn"><i class="fas fa-play" id="playIcon"></i></button>
                            <button class="ctrl-btn" id="rewindBtn" title="إرجاع 10 ثوانٍ"><i class="fas fa-undo"></i></button>
                            <button class="ctrl-btn" id="forwardBtn" title="تقديم 10 ثوانٍ"><i class="fas fa-redo"></i></button>
                            
                            <!-- Volume Bar -->
                            <div class="volume-container">
                                <button class="ctrl-btn" id="muteBtn"><i class="fas fa-volume-up" id="volumeIcon"></i></button>
                                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                            </div>
                        </div>

                        <div class="controls-right">
                            <span class="server-tag" id="switchServerBtn">السيرفر الرئيسي (HD)</span>
                            <button class="ctrl-btn" id="fullscreenBtn" title="ملء الشاشة"><i class="fas fa-expand"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4b93e22787e9bcf9d672b62daaedfceb';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t500';

        // روابط فيديوهات مباشرة وعالية الدقة للتجربة المستقرة (Sample Cinema Streams)
        const demoVideos = [
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4'
        ];

        let currentPage = 1;
        let currentEndpoint = '/discover/movie?sort_by=popularity.desc&primary_release_date.lte=2024-12-31';

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const genresBar = document.getElementById('genresBar');
        const sectionTitle = document.getElementById('sectionTitle');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const mainHeader = document.getElementById('mainHeader');

        // عناصر مشغل الفيديو
        const netflixPlayer = document.getElementById('netflixPlayer');
        const videoElement = document.getElementById('videoElement');
        const videoSource = document.getElementById('videoSource');
        const playerMovieTitle = document.getElementById('playerMovieTitle');
        const closePlayerBtn = document.getElementById('closePlayerBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const centerPlayBtn = document.getElementById('centerPlayBtn');
        const playIcon = document.getElementById('playIcon');
        const centerPlayIcon = document.getElementById('centerPlayIcon');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const volumeSlider = document.getElementById('volumeSlider');
        const seekBar = document.getElementById('seekBar');
        const seekFill = document.getElementById('seekFill');
        const currentTimeElem = document.getElementById('currentTime');
        const durationTimeElem = document.getElementById('durationTime');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const controlsOverlay = document.getElementById('controlsOverlay');
        const switchServerBtn = document.getElementById('switchServerBtn');

        // تأثير الهيدر عند التمرير
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) mainHeader.classList.add('scrolled');
            else mainHeader.classList.remove('scrolled');
        });

        // إنشاء بوستر SVG احتياطي
        function createFallbackPoster(title) {
            const cleanTitle = (title || 'فيلم سينمائي').replace(/[\'<">]/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1f1f1f"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient></defs><rect width="500" height="750" fill="url(#bg)"/><circle cx="250" cy="320" r="70" fill="#e50914" opacity="0.2"/><polygon points="235,285 280,320 235,355" fill="#e50914"/><text x="250" y="480" font-family="Cairo, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">${cleanTitle.length > 20 ? cleanTitle.substring(0, 20) + '...' : cleanTitle}</text><text x="250" y="520" font-family="Cairo, sans-serif" font-size="16" fill="#e50914" text-anchor="middle">سينمانا - FHD</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        // جلب الأفلام من TMDB
        async function fetchMovies(endpoint, page = 1, isAppend = false) {
            try {
                if (!isAppend) {
                    moviesGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري جلب الأفلام...</div>';
                }
                const url = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA&page=${page}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    renderMovies(data.results, isAppend);
                } else if (!isAppend) {
                    moviesGrid.innerHTML = '<div class="loading">لم يتم العثور على أية أفلام.</div>';
                }
            } catch (err) {
                console.error(err);
                if (!isAppend) moviesGrid.innerHTML = '<div class="loading">حدث خطأ أثناء تحميل البيانات.</div>';
            }
        }

        // عرض بطاقات الأفلام
        function renderMovies(movies, isAppend) {
            if (!isAppend) moviesGrid.innerHTML = '';

            movies.forEach((movie, index) => {
                const title = movie.title || movie.name || 'فيلم سينمائي';
                const fallback = createFallbackPoster(title);
                const poster = movie.poster_path ? (IMG_URL + movie.poster_path) : fallback;
                const release = (movie.release_date || '').split('-')[0] || '2024';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '8.1';

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${poster}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='${fallback}';">
                        <div class="rating-badge"><i class="fas fa-star"></i> ${rating}</div>
                        <div class="play-hover"><i class="fas fa-play-circle"></i></div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title" title="${title}">${title}</div>
                        <div class="movie-meta">
                            <span>${release}</span>
                            <span style="color:var(--primary-color); font-weight:bold;">HD</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openNetflixPlayer(movie, index));
                moviesGrid.appendChild(card);
            });
        }

        // فتح مشغل فيديو Netflix
        function openNetflixPlayer(movie, index) {
            const title = movie.title || movie.name || 'فيلم سينمائي';
            playerMovieTitle.textContent = title;

            // اختيار سيرفر فيديو عالي الجودة
            const streamUrl = demoVideos[index % demoVideos.length];
            videoSource.src = streamUrl;
            videoElement.load();

            netflixPlayer.style.display = 'block';
            document.body.style.overflow = 'hidden';

            // تشغيل الفيديو تلقائياً
            videoElement.play().then(() => {
                updatePlayState(true);
            }).catch(() => {
                updatePlayState(false);
            });
        }

        // إغلاق المشغل
        closePlayerBtn.addEventListener('click', closePlayer);
        function closePlayer() {
            videoElement.pause();
            netflixPlayer.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // التحكم بالتشغيل والتوقف
        function togglePlay() {
            if (videoElement.paused) {
                videoElement.play();
                updatePlayState(true);
            } else {
                videoElement.pause();
                updatePlayState(false);
            }
        }

        function updatePlayState(isPlaying) {
            if (isPlaying) {
                playIcon.className = 'fas fa-pause';
                centerPlayIcon.className = 'fas fa-pause';
            } else {
                playIcon.className = 'fas fa-play';
                centerPlayIcon.className = 'fas fa-play';
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);
        centerPlayBtn.addEventListener('click', togglePlay);

        // التقديم والترجيع
        rewindBtn.addEventListener('click', () => videoElement.currentTime -= 10);
        forwardBtn.addEventListener('click', () => videoElement.currentTime += 10);

        // شريط الصوت
        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            videoElement.volume = val;
            videoElement.muted = (val == 0);
            updateVolumeIcon(val);
        });

        muteBtn.addEventListener('click', () => {
            videoElement.muted = !videoElement.muted;
            if (videoElement.muted) {
                volumeIcon.className = 'fas fa-volume-mute';
            } else {
                updateVolumeIcon(videoElement.volume);
            }
        });

        function updateVolumeIcon(val) {
            if (val == 0) volumeIcon.className = 'fas fa-volume-mute';
            else if (val < 0.5) volumeIcon.className = 'fas fa-volume-down';
            else volumeIcon.className = 'fas fa-volume-up';
        }

        // تحديث الوقت والتقدم
        videoElement.addEventListener('timeupdate', () => {
            const cur = videoElement.currentTime;
            const dur = videoElement.duration || 0;

            if (dur > 0) {
                const perc = (cur / dur) * 100;
                seekFill.style.width = `${perc}%`;
                currentTimeElem.textContent = formatTime(cur);
                durationTimeElem.textContent = formatTime(dur);
            }
        });

        // الضغط على شريط التقديم
        seekBar.addEventListener('click', (e) => {
            const rect = seekBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            videoElement.currentTime = pos * videoElement.duration;
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // ملء الشاشة
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.getElementById('playerWrapper').requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        });

        // تغيير السيرفر
        switchServerBtn.addEventListener('click', () => {
            alert('أنت تعمل الآن على أسرع سيرفر بث مباشر متاح (Netflix Ultra Fast)');
        });

        // البحث والتصنيف
        let searchTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const q = e.target.value.trim();
            searchTimer = setTimeout(() => {
                currentPage = 1;
                if (q.length > 1) {
                    currentEndpoint = `/search/movie?query=${encodeURIComponent(q)}`;
                    sectionTitle.innerHTML = `<i class="fas fa-search"></i> نتائج البحث عن: ${q}`;
                    fetchMovies(currentEndpoint, 1);
                } else if (q.length === 0) {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc&primary_release_date.lte=2024-12-31';
                    sectionTitle.innerHTML = '<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأكثر مشاهدة الان';
                    fetchMovies(currentEndpoint, 1);
                }
            }, 500);
        });

        genresBar.addEventListener('click', (e) => {
            if (e.target.classList.contains('genre-btn')) {
                document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const id = e.target.getAttribute('data-id');
                currentPage = 1;
                if (id === 'all') {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc&primary_release_date.lte=2024-12-31';
                    sectionTitle.innerHTML = '<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأكثر مشاهدة الان';
                } else {
                    currentEndpoint = `/discover/movie?with_genres=${id}&sort_by=popularity.desc&primary_release_date.lte=2024-12-31`;
                    sectionTitle.innerHTML = `<i class="fas fa-film"></i> أفلام ${e.target.textContent}`;
                }
                fetchMovies(currentEndpoint, 1);
            }
        });

        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            fetchMovies(currentEndpoint, currentPage, true);
        });

        // التحميل المبدئي
        fetchMovies(currentEndpoint, 1);
    </script>
</body>
</html>
