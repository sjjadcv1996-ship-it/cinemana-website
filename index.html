<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETFLIX - نتفلكس سينما</title>
    
    <!-- FontAwesome icons & Cairo font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --netflix-red: #E50914;
            --netflix-dark-red: #B9090B;
            --bg-black: #141414;
            --card-bg: #181818;
            --text-white: #FFFFFF;
            --text-gray: #AAAAAA;
            --gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Navbar Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 4%;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,20,0) 100%);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            transition: background 0.3s ease;
        }

        header.scrolled {
            background: #141414;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .brand-logo {
            font-size: 2.1rem;
            font-weight: 900;
            color: var(--netflix-red);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            position: relative;
            width: 280px;
        }

        .search-container input {
            width: 100%;
            padding: 9px 38px 9px 15px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            outline: none;
            font-size: 0.88rem;
            transition: border-color 0.3s;
        }

        .search-container input:focus {
            border-color: var(--netflix-red);
        }

        .search-container i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        /* Hero Banner Section */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 75vh;
            min-height: 500px;
            background-size: cover;
            background-position: center top;
            display: flex;
            align-items: flex-end;
            padding: 0 4% 80px;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, var(--bg-black) 5%, rgba(20,20,20,0.3) 50%, rgba(0,0,0,0.8) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .hero-badge {
            display: inline-block;
            background: var(--netflix-red);
            color: #fff;
            padding: 3px 10px;
            font-weight: 800;
            font-size: 0.75rem;
            border-radius: 3px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 12px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .hero-desc {
            font-size: 0.95rem;
            color: #e5e5e5;
            line-height: 1.6;
            margin-bottom: 22px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .hero-btns {
            display: flex;
            gap: 12px;
        }

        .btn-play {
            background: var(--netflix-red);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-play:hover {
            background: var(--netflix-dark-red);
            transform: scale(1.03);
        }

        /* Filter Genres Bar */
        .categories-nav {
            display: flex;
            gap: 12px;
            padding: 20px 4% 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--netflix-red);
            border-color: var(--netflix-red);
        }

        /* Movies Content Grid */
        .main-content {
            padding: 20px 4% 60px;
        }

        .section-header {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-right: 4px solid var(--netflix-red);
            padding-right: 12px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 18px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card:hover {
            transform: scale(1.06);
            z-index: 20;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .poster-box {
            position: relative;
            width: 100%;
            padding-top: 150%;
            background: #222;
        }

        .poster-box img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-rating {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.85);
            color: var(--gold);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 800;
            backdrop-filter: blur(4px);
        }

        .hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .hover-overlay i {
            font-size: 3.2rem;
            color: var(--netflix-red);
            filter: drop-shadow(0 0 10px rgba(229,9,20,0.6));
        }

        .movie-card:hover .hover-overlay {
            opacity: 1;
        }

        .card-details {
            padding: 10px 12px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-gray);
            margin-top: 5px;
        }

        .quality-tag {
            border: 1px solid var(--netflix-red);
            color: var(--netflix-red);
            font-size: 0.65rem;
            padding: 0px 4px;
            border-radius: 2px;
            font-weight: 800;
        }

        /* Netflix Style Player Modal */
        .modal-player {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 99999;
        }

        .player-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .player-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover { color: var(--netflix-red); }

        .servers-group {
            display: flex;
            gap: 8px;
        }

        .srv-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .srv-btn.active, .srv-btn:hover {
            background: var(--netflix-red);
            border-color: var(--netflix-red);
        }

        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background: #000;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-loadmore {
            display: block;
            margin: 40px auto;
            background: var(--netflix-red);
            color: #fff;
            border: none;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-loadmore:hover {
            background: var(--netflix-dark-red);
        }

        .spinner-box {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-gray);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header id="navbar">
        <a href="#" class="brand-logo"><i class="fas fa-play"></i> NETFLIX</a>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero-banner" id="heroBanner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="hero-badge">الأكثر مشاهدة</span>
            <h1 class="hero-title" id="heroTitle">جاري تحميل الفيلم...</h1>
            <p class="hero-desc" id="heroDesc">تفاصيل الفيلم ستظهر هنا عند تحميل الصفحة...</p>
            <div class="hero-btns">
                <button class="btn-play" id="heroPlayBtn"><i class="fas fa-play"></i> مشاهدة الآن</button>
            </div>
        </div>
    </div>

    <!-- Genres Filter -->
    <div class="categories-nav" id="categoriesNav">
        <button class="cat-btn active" data-id="all">الكل</button>
        <button class="cat-btn" data-id="28">أكشن</button>
        <button class="cat-btn" data-id="35">كوميديا</button>
        <button class="cat-btn" data-id="18">دراما</button>
        <button class="cat-btn" data-id="27">رعب</button>
        <button class="cat-btn" data-id="878">خيال علمي</button>
        <button class="cat-btn" data-id="10749">رومانسية</button>
    </div>

    <div class="main-content">
        <div class="section-header" id="sectionHeader">أحدث الأفلام المضافة</div>
        <div class="movies-grid" id="moviesGrid">
            <div class="spinner-box"><i class="fas fa-spinner fa-spin"></i> جاري تحميل المكتبة...</div>
        </div>
        <button class="btn-loadmore" id="loadMoreBtn">عرض المزيد</button>
    </div>

    <!-- Player Modal -->
    <div class="modal-player" id="playerModal">
        <div class="player-wrapper">
            <div class="player-bar">
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="close-btn" id="closePlayer"><i class="fas fa-arrow-right"></i></button>
                    <h3 id="playerTitle" style="font-size:1.1rem; font-weight:800;">اسم الفيلم</h3>
                </div>
                <div class="servers-group">
                    <button class="srv-btn active" onclick="changeServer(1)">سيرفر 1</button>
                    <button class="srv-btn" onclick="changeServer(2)">سيرفر 2</button>
                    <button class="srv-btn" onclick="changeServer(3)">سيرفر 3</button>
                </div>
            </div>
            <div class="iframe-container">
                <iframe id="videoIframe" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4b93e22787e9bcf9d672b62daaedfceb';
        const BASE_URL = 'https://api.themoviedb.org/3';

        let currentPage = 1;
        let currentEndpoint = '/discover/movie?sort_by=popularity.desc';
        let activeTmdbId = null;
        let activeImdbId = null;
        let topMovieData = null;

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const categoriesNav = document.getElementById('categoriesNav');
        const sectionHeader = document.getElementById('sectionHeader');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const playerModal = document.getElementById('playerModal');
        const videoIframe = document.getElementById('videoIframe');
        const playerTitle = document.getElementById('playerTitle');
        const closePlayer = document.getElementById('closePlayer');
        const navbar = document.getElementById('navbar');

        // Scroll navbar style
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // توليد غلاف SVG محلي نقي في حال عدم ظهور صورة TMDB
        function createFallbackPoster(title) {
            const cleanTitle = (title || 'فيلم سينمائي').replace(/[\'<">]/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750"><rect width="500" height="750" fill="#181818"/><circle cx="250" cy="300" r="75" fill="#E50914" opacity="0.25"/><polygon points="230,265 285,300 230,335" fill="#E50914"/><text x="250" y="470" font-family="Cairo, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">${cleanTitle.length > 18 ? cleanTitle.substring(0, 18) + '...' : cleanTitle}</text><text x="250" y="515" font-family="Cairo" font-size="16" fill="#FFD700" text-anchor="middle">NETFLIX CINEMA</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        // جلب الأفلام
        async function loadMovies(endpoint, page = 1, append = false) {
            try {
                if (!append) moviesGrid.innerHTML = '<div class="spinner-box"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
                
                const url = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA&page=${page}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    if (page === 1 && !append && endpoint.includes('discover')) {
                        setupHeroBanner(data.results[0]);
                    }
                    renderCards(data.results, append);
                } else if (!append) {
                    moviesGrid.innerHTML = '<div class="spinner-box">عذراً، لم نتمكن من العثور على أية نتائج.</div>';
                }
            } catch (err) {
                if (!append) moviesGrid.innerHTML = '<div class="spinner-box">تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً.</div>';
            }
        }

        // إعداد الهيرو بنر الأعلى
        function setupHeroBanner(movie) {
            topMovieData = movie;
            const banner = document.getElementById('heroBanner');
            const title = document.getElementById('heroTitle');
            const desc = document.getElementById('heroDesc');
            
            const backdropPath = movie.backdrop_path ? `https://image.tmdb.org/t/p/original${movie.backdrop_path}` : 'https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=1200';
            banner.style.backgroundImage = `url('${backdropPath}')`;
            
            title.textContent = movie.title || movie.name;
            desc.textContent = movie.overview || 'استمتع بمشاهدة هذا الفيلم الرائع بدقة عالية على منصتنا.';
        }

        document.getElementById('heroPlayBtn').addEventListener('click', () => {
            if (topMovieData) startPlayback(topMovieData);
        });

        // عرض كروت الأفلام
        function renderCards(movies, append) {
            if (!append) moviesGrid.innerHTML = '';

            movies.forEach(movie => {
                const title = movie.title || movie.name || 'فيلم سينمائي';
                const fallbackImg = createFallbackPoster(title);
                const posterImg = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : fallbackImg;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-box">
                        <img src="${posterImg}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                        <div class="badge-rating"><i class="fas fa-star"></i> ${(movie.vote_average || 7.0).toFixed(1)}</div>
                        <div class="hover-overlay"><i class="fas fa-play-circle"></i></div>
                    </div>
                    <div class="card-details">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">
                            <span>${(movie.release_date || '2024').split('-')[0]}</span>
                            <span class="quality-tag">4K HD</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => startPlayback(movie));
                moviesGrid.appendChild(card);
            });
        }

        // بدء التشغيل وجلب IMDb ID المباشر
        async function startPlayback(movie) {
            activeTmdbId = movie.id;
            playerTitle.textContent = movie.title || movie.name;

            try {
                const res = await fetch(`${BASE_URL}/movie/${movie.id}/external_ids?api_key=${API_KEY}`);
                const data = await res.json();
                activeImdbId = data.imdb_id || null;
            } catch (e) {
                activeImdbId = null;
            }

            changeServer(1);
            playerModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // التبديل بين السيرفرات
        function changeServer(srvNum) {
            document.querySelectorAll('.srv-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === (srvNum - 1));
            });

            const targetId = activeImdbId || activeTmdbId;

            if (srvNum === 1) {
                videoIframe.src = `https://vidsrc.cc/v2/embed/movie/${targetId}`;
            } else if (srvNum === 2) {
                videoIframe.src = `https://vidsrc.me/embed/movie/${targetId}`;
            } else if (srvNum === 3) {
                videoIframe.src = `https://autoembed.co/movie/tmdb/${activeTmdbId}`;
            }
        }

        closePlayer.addEventListener('click', () => {
            videoIframe.src = '';
            playerModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        });

        // البحث التفاعلي
        let searchTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const val = e.target.value.trim();

            searchTimer = setTimeout(() => {
                currentPage = 1;
                if (val.length > 1) {
                    currentEndpoint = `/search/movie?query=${encodeURIComponent(val)}`;
                    sectionHeader.textContent = `نتائج البحث عن: ${val}`;
                    loadMovies(currentEndpoint, 1);
                } else if (val.length === 0) {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc';
                    sectionHeader.textContent = 'أحدث الأفلام المضافة';
                    loadMovies(currentEndpoint, 1);
                }
            }, 400);
        });

        // التصفية حسب التصنيفات
        categoriesNav.addEventListener('click', (e) => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const genreId = e.target.getAttribute('data-id');
                currentPage = 1;

                if (genreId === 'all') {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc';
                    sectionHeader.textContent = 'أحدث الأفلام المضافة';
                } else {
                    currentEndpoint = `/discover/movie?with_genres=${genreId}&sort_by=popularity.desc`;
                    sectionHeader.textContent = `أفلام قسم: ${e.target.textContent}`;
                }
                loadMovies(currentEndpoint, 1);
            }
        });

        // زر التحميل المزدوج
        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            loadMovies(currentEndpoint, currentPage, true);
        });

        // البدء عند أول فتح للموقع
        loadMovies(currentEndpoint, 1);
    </script>
</body>
</html>
