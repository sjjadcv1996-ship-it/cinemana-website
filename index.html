<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - منصة الأفلام مع مشغل Plyr والترجمة</title>
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Plyr CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />

    <style>
        :root {
            --netflix-red: #E50914;
            --bg-dark: #111111;
            --bg-card: #181818;
            --text-white: #ffffff;
            --text-gray: #a3a3a3;
            --plyr-color-main: var(--netflix-red);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        /* Top Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 3%;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(17,17,17,0) 100%);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .nav-right { display: flex; align-items: center; gap: 25px; }
        .logo { color: var(--netflix-red); font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 16px; }
        .nav-links a { color: #e5e5e5; text-decoration: none; font-size: 0.82rem; font-weight: 600; }
        .nav-links a.active { color: #fff; font-weight: 800; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; }
        .nav-left { display: flex; align-items: center; gap: 18px; }
        .kids-badge { background: rgba(255,255,255,0.15); color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .avatar { width: 28px; height: 28px; border-radius: 4px; object-fit: cover; }

        /* Hero Banner */
        .hero-container { padding: 80px 3% 20px; }
        .hero-card {
            position: relative;
            width: 100%;
            height: 68vh;
            min-height: 440px;
            border-radius: 20px;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1600') center/cover no-repeat;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            align-items: flex-end;
        }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%); }
        .hero-info { position: relative; z-index: 5; padding: 40px; width: 100%; }
        .hero-title-img { font-size: 3rem; font-weight: 900; line-height: 1.1; margin-bottom: 12px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: #e5e5e5; margin-bottom: 20px; font-weight: 600; }
        .age-badge { border: 1px solid rgba(255,255,255,0.6); padding: 0 6px; border-radius: 2px; font-size: 0.75rem; }
        
        .btn-play-main {
            background: #ffffff; color: #000000; border: none; padding: 8px 26px; font-size: 0.95rem; font-weight: 800; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: transform 0.2s;
        }
        .btn-play-main:hover { transform: scale(1.03); background: #e6e6e6; }

        /* Content Rows */
        .sliders-section { padding: 10px 3%; }
        .row-title { font-size: 1.15rem; font-weight: 800; margin: 25px 0 12px 0; color: #e5e5e5; }
        .cards-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; min-height: 145px; }
        .cards-row::-webkit-scrollbar { display: none; }
        
        .media-card {
            flex: 0 0 calc(16.666% - 10px);
            min-width: 170px;
            background: var(--bg-card);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .media-card:hover { transform: scale(1.08); z-index: 10; }
        .card-thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #222; }
        .card-title-overlay {
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            background: var(--bg-card);
        }

        /* Plyr Player Modal */
        .player-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .player-box-wrapper {
            width: 95%;
            max-width: 1100px;
            background: #141414;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .player-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #1f1f1f;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .close-modal-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .close-modal-btn:hover { color: var(--netflix-red); }

        .subtitle-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: #181818;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.85rem;
            color: #ccc;
        }
        .subtitle-upload-box label {
            background: var(--netflix-red);
            color: white;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: background 0.2s;
        }
        .subtitle-upload-box label:hover { background: #f40612; }
        .subtitle-upload-box input[type="file"] { display: none; }
        #subFileName { color: var(--text-gray); font-size: 0.8rem; }

        .video-container {
            width: 100%;
            background: #000;
            line-height: 0;
        }

        @media (max-width: 1024px) {
            .media-card { flex: 0 0 calc(25% - 10px); }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="nav-right">
            <a href="#" class="logo">NETFLIX</a>
            <ul class="nav-links">
                <li><a href="#" class="active">الصفحة الرئيسية</a></li>
                <li><a href="#">مسلسلات وبرامج</a></li>
                <li><a href="#">الأفلام</a></li>
                <li><a href="#">ألعاب</a></li>
                <li><a href="#">الجديد والمشهور</a></li>
            </ul>
        </div>
        <div class="nav-left">
            <span class="kids-badge">الأطفال</span>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" class="avatar" alt="Profile">
        </div>
    </header>

    <!-- Hero Section -->
    <div class="hero-container">
        <div class="hero-card" id="heroBanner">
            <div class="hero-overlay"></div>
            <div class="hero-info">
                <div class="hero-title-img" id="heroTitle">صائد الساحرات الأخيرة</div>
                <div class="hero-meta">
                    <span>أفلام نتفلكس</span> • <span>عالية الدقة HD</span>
                    <span class="age-badge">+16</span>
                </div>
                <button class="btn-play-main" id="playHeroBtn"><i class="fas fa-play"></i> تشغيل الفيلم (Plyr)</button>
            </div>
        </div>
    </div>

    <!-- Rows -->
    <div class="sliders-section">
        <div class="row-title">أفضل الاختيارات من أجلك اليوم</div>
        <div class="cards-row" id="rowGrid1"></div>

        <div class="row-title">الأفلام الرائجة والمشهورة</div>
        <div class="cards-row" id="rowGrid2"></div>
    </div>

    <!-- Plyr Video Modal -->
    <div class="player-modal" id="plyrModal">
        <div class="player-box-wrapper">
            <div class="player-top-bar">
                <h3 id="modalMovieTitle" style="font-size: 1rem;">مشغل الأفلام</h3>
                <button class="close-modal-btn" id="closePlyrModal"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="subtitle-upload-box">
                <i class="fas fa-closed-captioning" style="color: var(--netflix-red); font-size: 1.1rem;"></i>
                <span>الترجمة العربية:</span>
                <label for="subFileInput">
                    <i class="fas fa-upload"></i> اختر ملف ترجمة (.vtt)
                </label>
                <input type="file" id="subFileInput" accept=".vtt">
                <span id="subFileName">لم يتم اختيار ملف ترجمة</span>
            </div>

            <div class="video-container">
                <video id="player" playsinline controls crossorigin>
                    <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.mp4" type="video/mp4" />
                    <track kind="captions" label="العربية" srclang="ar" src="" default />
                </video>
            </div>
        </div>
    </div>

    <!-- Plyr JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <script>
        // قائمة أفلام جاهزة ومضمونة مع صور خلفيات حقيقية عالية الجودة لضمان ظهور الغلافات فوراً بدون أخطاء
        const sampleMovies = [
            { title: "صائد الساحرات الأخيرة", image: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=800" },
            { title: "سبايدر مان: يوم جديد", image: "https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=800" },
            { title: "جون ويك: القسم الرابع", image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800" },
            { title: "المهمة المستحيلة", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800" },
            { title: "أفاتار: طريق الماء", image: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800" },
            { title: "الجوكر", image: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=800" },
            { title: "البحث عن النجوم", image: "https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=800" },
            { title: "مغامرات الفضاء", image: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=800" }
        ];

        // تهيئة مشغل Plyr مع إعدادات التحكم والترجمة
        const playerInstance = new Plyr('#player', {
            captions: { active: true, update: true, language: 'ar' },
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen']
        });

        const plyrModal = document.getElementById('plyrModal');
        const closePlyrModal = document.getElementById('closePlyrModal');
        const subFileInput = document.getElementById('subFileInput');
        const subFileName = document.getElementById('subFileName');

        function fillRow(containerId, movies) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <img src="${movie.image}" class="card-thumb" alt="${movie.title}" loading="lazy">
                    <div class="card-title-overlay">${movie.title}</div>
                `;

                card.addEventListener('click', () => {
                    document.getElementById('modalMovieTitle').textContent = movie.title;
                    plyrModal.style.display = 'flex';
                    playerInstance.play();
                });

                container.appendChild(card);
            });
        }

        // تعبئة الصفوف بالصور الحقيقية
        fillRow('rowGrid1', sampleMovies);
        fillRow('rowGrid2', sampleMovies.slice().reverse());

        document.getElementById('playHeroBtn').addEventListener('click', () => {
            document.getElementById('modalMovieTitle').textContent = document.getElementById('heroTitle').textContent;
            plyrModal.style.display = 'flex';
            playerInstance.play();
        });

        closePlyrModal.addEventListener('click', () => {
            playerInstance.pause();
            plyrModal.style.display = 'none';
        });

        // تفعيل وتحميل الترجمة العربية (.vtt) وربطها بالمشغل فوراً
        subFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                subFileName.textContent = file.name;
                const subURL = URL.createObjectURL(file);
                const videoEl = document.getElementById('player');
                
                const oldTrack = videoEl.querySelector('track');
                if (oldTrack) oldTrack.remove();

                const newTrack = document.createElement('track');
                newTrack.kind = 'captions';
                newTrack.label = 'العربية (مخصص)';
                newTrack.srclang = 'ar';
                newTrack.src = subURL;
                newTrack.default = true;

                videoEl.appendChild(newTrack);
                playerInstance.restart();
                
                setTimeout(() => {
                    playerInstance.currentLanguage = 'ar';
                    playerInstance.toggleCaptions(true);
                }, 400);
            }
        });
    </script>
</body>
</html>
