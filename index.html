<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - منصة الأفلام والمسلسلات</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914;
            --bg-main: #0a0b0e;
            --bg-card: #14161d;
            --bg-card-hover: #1c1f2a;
            --text-main: #ffffff;
            --text-muted: #9ab0c1;
            --accent-gold: #ffb400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 50px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(10, 11, 14, 0.95);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 11px 45px 11px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .genres-bar {
            display: flex;
            gap: 12px;
            padding: 20px 5%;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .genres-bar::-webkit-scrollbar {
            display: none;
        }

        .genre-btn {
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 9px 22px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .genre-btn:hover, .genre-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .container {
            padding: 10px 5% 40px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 25px;
            border-right: 4px solid var(--primary-color);
            padding-right: 12px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 22px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(229, 9, 20, 0.3);
            border-color: rgba(229, 9, 20, 0.5);
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%;
            background: #1a1c23;
            overflow: hidden;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--accent-gold);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .movie-info {
            padding: 14px;
        }

        .movie-title {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 6px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        /* Modal Player Enhanced */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            max-width: 950px;
            margin: 20px auto;
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 1.4rem;
            color: #fff;
            cursor: pointer;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-details {
            padding: 20px;
        }

        .server-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 12px;
        }

        .server-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .server-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        /* Sound Boost Bar */
        .audio-boost-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .audio-boost-bar label {
            font-size: 0.9rem;
            color: var(--accent-gold);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .audio-boost-bar input[type=range] {
            flex-grow: 1;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><i class="fas fa-play-circle"></i> سينمانا</a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
        </div>
    </header>

    <div class="genres-bar" id="genresBar">
        <button class="genre-btn active" data-id="all">الكل</button>
        <button class="genre-btn" data-id="28">أكشن</button>
        <button class="genre-btn" data-id="35">كوميديا</button>
        <button class="genre-btn" data-id="18">دراما</button>
        <button class="genre-btn" data-id="27">رعب</button>
        <button class="genre-btn" data-id="878">خيال علمي</button>
        <button class="genre-btn" data-id="10749">رومانسي</button>
        <button class="genre-btn" data-id="16">أنيميشن</button>
    </div>

    <div class="container">
        <h2 class="section-title" id="sectionTitle">الأفلام الشائعة</h2>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading">جاري تحميل الأفلام...</div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="video-container">
                <!-- أذونات الصوت والشاشة المكتملة مدمجة هنا -->
                <iframe id="videoIframe" src="" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; volume"></iframe>
            </div>
            <div class="player-details">
                <h2 id="modalTitle" style="margin-bottom: 12px; font-size: 1.4rem;">اسم الفيلم</h2>
                
                <!-- سيرفرات التشغيل الأكثر استقراراً -->
                <div class="server-selector">
                    <button class="server-btn active" onclick="changeServer(1)"><i class="fas fa-play"></i> سيرفر 1 (أساسي)</button>
                    <button class="server-btn" onclick="changeServer(2)"><i class="fas fa-play"></i> سيرفر 2 (سريع)</button>
                    <button class="server-btn" onclick="changeServer(3)"><i class="fas fa-play"></i> سيرفر 3 (احتياطي)</button>
                    <button class="server-btn" onclick="changeServer(4)"><i class="fas fa-play"></i> سيرفر 4 (HD)</button>
                </div>

                <!-- شريط رفع الصوت والتضخيم -->
                <div class="audio-boost-bar">
                    <label><i class="fas fa-volume-up"></i> رفع الصوت:</label>
                    <input type="range" id="volumeRange" min="0" max="100" value="100" oninput="adjustVolume(this.value)">
                    <span id="volumeVal" style="font-weight: bold; min-width: 40px;">100%</span>
                </div>

                <p id="modalOverview" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;"></p>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4b93e22787e9bcf9d672b62daaedfceb';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t500';

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const genresBar = document.getElementById('genresBar');
        const sectionTitle = document.getElementById('sectionTitle');
        const videoModal = document.getElementById('videoModal');
        const closeModal = document.getElementById('closeModal');
        const videoIframe = document.getElementById('videoIframe');
        const modalTitle = document.getElementById('modalTitle');
        const modalOverview = document.getElementById('modalOverview');

        let currentMovieId = null;

        function createFallbackPoster(title) {
            const cleanTitle = (title || 'فيلم سينمائي').replace(/[\'<">]/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750"><defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e222d"/><stop offset="100%" stop-color="#0a0b0e"/></linearGradient></defs><rect width="500" height="750" fill="url(#bg)"/><circle cx="250" cy="300" r="80" fill="#e50914" opacity="0.15"/><polygon points="230,260 290,300 230,340" fill="#e50914"/><text x="250" y="480" font-family="Cairo, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">${cleanTitle.length > 20 ? cleanTitle.substring(0, 20) + '...' : cleanTitle}</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        async function getMovies(endpoint) {
            try {
                moviesGrid.innerHTML = '<div class="loading">جاري التحميل...</div>';
                const url = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA`;
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    displayMovies(data.results);
                } else {
                    moviesGrid.innerHTML = '<div class="loading">لم يتم العثور على أية أفلام.</div>';
                }
            } catch (error) {
                moviesGrid.innerHTML = '<div class="loading">حدث خطأ في الاتصال بالخادم.</div>';
            }
        }

        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            movies.forEach(movie => {
                const title = movie.title || movie.name || 'بدون عنوان';
                const fallbackPoster = createFallbackPoster(title);
                const posterPath = movie.poster_path ? (IMG_URL + movie.poster_path) : fallbackPoster;
                const releaseYear = (movie.release_date || '').split('-')[0] || '2024';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '8.0';

                const card = document.createElement('div');
                card.classList.add('movie-card');
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${posterPath}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackPoster}';">
                        <div class="rating-badge"><i class="fas fa-star"></i> ${rating}</div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title" title="${title}">${title}</div>
                        <div class="movie-meta">
                            <span>${releaseYear}</span>
                            <span style="color:#e50914; font-weight:bold;">FHD</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openPlayer(movie));
                moviesGrid.appendChild(card);
            });
        }

        function openPlayer(movie) {
            currentMovieId = movie.id;
            modalTitle.textContent = movie.title || movie.name;
            modalOverview.textContent = movie.overview || 'لا يوجد وصف متاح باللغة العربية.';
            
            // إعادة تعيين شريط الصوت عند الفتح
            document.getElementById('volumeRange').value = 100;
            document.getElementById('volumeVal').textContent = '100%';

            changeServer(1);
            videoModal.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        // السيرفرات المدمجة مع روابط جلب فيديو مباشرة داخل المشغل
        function changeServer(serverNum) {
            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === (serverNum - 1));
            });

            let streamUrl = '';
            if (serverNum === 1) {
                streamUrl = `https://vidsrc.me/embed/movie/${currentMovieId}`;
            } else if (serverNum === 2) {
                streamUrl = `https://vidsrc.xyz/embed/movie/${currentMovieId}`;
            } else if (serverNum === 3) {
                streamUrl = `https://embed.su/embed/movie/${currentMovieId}`;
            } else if (serverNum === 4) {
                streamUrl = `https://vidsrc.cc/v2/embed/movie/${currentMovieId}`;
            }

            videoIframe.src = streamUrl;
        }

        function adjustVolume(val) {
            document.getElementById('volumeVal').textContent = val + '%';
            // محاولة إرسال أمر تعديل الصوت ببروتوكول postMessage للـ iframe
            if (videoIframe.contentWindow) {
                videoIframe.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: 'setVolume',
                    args: [val]
                }), '*');
            }
        }

        closeModal.addEventListener('click', () => {
            videoModal.style.display = 'none';
            videoIframe.src = '';
            document.body.style.overflow = 'auto';
        });

        // البحث والتصنيف
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            searchTimeout = setTimeout(() => {
                if (query.length > 1) {
                    sectionTitle.textContent = `نتائج البحث: ${query}`;
                    getMovies(`/search/movie?query=${encodeURIComponent(query)}`);
                } else if (query.length === 0) {
                    sectionTitle.textContent = 'الأفلام الشائعة';
                    getMovies('/discover/movie?sort_by=popularity.desc');
                }
            }, 500);
        });

        genresBar.addEventListener('click', (e) => {
            if (e.target.classList.contains('genre-btn')) {
                document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                const genreId = e.target.getAttribute('data-id');
                if (genreId === 'all') {
                    sectionTitle.textContent = 'الأفلام الشائعة';
                    getMovies('/discover/movie?sort_by=popularity.desc');
                } else {
                    sectionTitle.textContent = `أفلام ${e.target.textContent}`;
                    getMovies(`/discover/movie?with_genres=${genreId}&sort_by=popularity.desc`);
                }
            }
        });

        // التحميل المبدئي
        getMovies('/discover/movie?sort_by=popularity.desc');
    </script>
</body>
</html>
