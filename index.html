<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينمانا - المنصة السينمائية</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914;
            --primary-hover: #b9090b;
            --bg-main: #141414;
            --bg-card: #1f1f1f;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent-gold: #ffb400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 4%;
            background: rgba(0,0,0,0.95);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 40px 9px 15px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            outline: none;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .genres-bar {
            display: flex;
            gap: 10px;
            padding: 90px 4% 15px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .genres-bar::-webkit-scrollbar { display: none; }

        .genre-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .genre-btn.active {
            background: #fff;
            color: #000;
            font-weight: 700;
        }

        .container {
            padding: 10px 4% 50px;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
        }

        .movie-card:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .poster-wrapper {
            position: relative;
            width: 100%;
            padding-top: 150%;
            background: #222;
        }

        .poster-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rating-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--accent-gold);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .play-hover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .play-hover i {
            font-size: 3rem;
            color: var(--primary-color);
        }

        .movie-card:hover .play-hover { opacity: 1; }

        .movie-info { padding: 10px; }

        .movie-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .netflix-player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.98);
            z-index: 9999;
        }

        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .player-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(0,0,0,0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .close-player-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .server-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .server-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .iframe-wrapper {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .load-more-btn {
            display: block;
            margin: 30px auto;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 12px 35px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 1.2rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><i class="fas fa-play-circle"></i> سينمانا</a>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم...">
        </div>
    </header>

    <div class="genres-bar" id="genresBar">
        <button class="genre-btn active" data-id="all">الكل</button>
        <button class="genre-btn" data-id="28">أكشن</button>
        <button class="genre-btn" data-id="35">كوميديا</button>
        <button class="genre-btn" data-id="18">دراما</button>
        <button class="genre-btn" data-id="27">رعب</button>
        <button class="genre-btn" data-id="878">خيال علمي</button>
    </div>

    <div class="container">
        <div class="section-title" id="sectionTitle">
            <i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام المتاحة للتشغيل
        </div>
        <div class="movies-grid" id="moviesGrid">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الأفلام والأغلفة...</div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn">تحميل المزيد</button>
    </div>

    <!-- Player Modal -->
    <div class="netflix-player-modal" id="netflixPlayer">
        <div class="player-container">
            <div class="player-top-bar">
                <div style="display:flex; align-items:center; gap:15px;">
                    <button class="close-player-btn" id="closePlayerBtn"><i class="fas fa-arrow-right"></i></button>
                    <div style="font-size: 1.1rem; font-weight:800;" id="playerMovieTitle">اسم الفيلم</div>
                </div>
                <div style="display:flex; gap:8px;">
                    <button class="server-btn active" onclick="switchServer(1)">سيرفر 1</button>
                    <button class="server-btn" onclick="switchServer(2)">سيرفر 2</button>
                    <button class="server-btn" onclick="switchServer(3)">سيرفر 3</button>
                </div>
            </div>
            <div class="iframe-wrapper">
                <iframe id="mainIframePlayer" src="" allowfullscreen="true" allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '4b93e22787e9bcf9d672b62daaedfceb';
        const BASE_URL = 'https://api.themoviedb.org/3';

        let currentPage = 1;
        let currentEndpoint = '/discover/movie?sort_by=popularity.desc';
        let currentTmdbId = null;
        let currentImdbId = null;

        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const genresBar = document.getElementById('genresBar');
        const sectionTitle = document.getElementById('sectionTitle');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const netflixPlayer = document.getElementById('netflixPlayer');
        const mainIframePlayer = document.getElementById('mainIframePlayer');
        const playerMovieTitle = document.getElementById('playerMovieTitle');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        // انشاء بوستر رسومي SVG مضمون الظهور 100% داخل المتصفح بدون الحاجة للإنترنت
        function generateLocalPoster(title) {
            const cleanTitle = (title || 'فيلم').replace(/[\'<">]/g, '');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750" viewBox="0 0 500 750"><rect width="500" height="750" fill="#1f1f1f"/><circle cx="250" cy="300" r="80" fill="#e50914" opacity="0.3"/><polygon points="230,260 290,300 230,340" fill="#e50914"/><text x="250" y="480" font-family="Cairo, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">${cleanTitle.length > 18 ? cleanTitle.substring(0, 18) + '...' : cleanTitle}</text><text x="250" y="520" font-family="Cairo" font-size="18" fill="#ffb400" text-anchor="middle">سينمانا - مشاهدة الآن</text></svg>`;
            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        async function fetchMovies(endpoint, page = 1, isAppend = false) {
            try {
                if (!isAppend) moviesGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>';
                const url = `${BASE_URL}${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${API_KEY}&language=ar-SA&page=${page}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    renderMovies(data.results, isAppend);
                } else if (!isAppend) {
                    moviesGrid.innerHTML = '<div class="loading">لم يتم العثور على أية أفلام.</div>';
                }
            } catch (err) {
                if (!isAppend) moviesGrid.innerHTML = '<div class="loading">حدث خطأ أثناء جلب البيانات.</div>';
            }
        }

        function renderMovies(movies, isAppend) {
            if (!isAppend) moviesGrid.innerHTML = '';

            movies.forEach(movie => {
                const title = movie.title || movie.name || 'فيلم سينمائي';
                const localFallback = generateLocalPoster(title);
                
                // رابط الصورة المباشر من سيرفرات TMDB بدقة عالية
                const primaryPoster = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : localFallback;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="poster-wrapper">
                        <img src="${primaryPoster}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='${localFallback}';">
                        <div class="rating-badge"><i class="fas fa-star"></i> ${(movie.vote_average || 7.5).toFixed(1)}</div>
                        <div class="play-hover"><i class="fas fa-play-circle"></i></div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title" title="${title}">${title}</div>
                        <div class="movie-meta">
                            <span>${(movie.release_date || '2024').split('-')[0]}</span>
                            <span style="color:var(--primary-color); font-weight:bold;">FHD</span>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openMoviePlayer(movie));
                moviesGrid.appendChild(card);
            });
        }

        // جلب معرف IMDb لضمان عمل المشغل الخارجي 100%
        async function openMoviePlayer(movie) {
            currentTmdbId = movie.id;
            playerMovieTitle.textContent = movie.title || movie.name;

            try {
                // جلب IMDb ID
                const extRes = await fetch(`${BASE_URL}/movie/${movie.id}/external_ids?api_key=${API_KEY}`);
                const extData = await extRes.json();
                currentImdbId = extData.imdb_id || null;
            } catch (e) {
                currentImdbId = null;
            }

            switchServer(1);
            netflixPlayer.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function switchServer(num) {
            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === (num - 1));
            });

            const idToUse = currentImdbId || currentTmdbId;

            if (num === 1) {
                mainIframePlayer.src = `https://vidsrc.cc/v2/embed/movie/${idToUse}`;
            } else if (num === 2) {
                mainIframePlayer.src = `https://vidsrc.me/embed/movie/${idToUse}`;
            } else if (num === 3) {
                mainIframePlayer.src = `https://vidsrc.xyz/embed/movie/${idToUse}`;
            }
        }

        closePlayerBtn.addEventListener('click', () => {
            mainIframePlayer.src = '';
            netflixPlayer.style.display = 'none';
            document.body.style.overflow = 'auto';
        });

        // البحث
        let searchTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const q = e.target.value.trim();
            searchTimer = setTimeout(() => {
                currentPage = 1;
                if (q.length > 1) {
                    currentEndpoint = `/search/movie?query=${encodeURIComponent(q)}`;
                    sectionTitle.innerHTML = `<i class="fas fa-search"></i> نتائج البحث عن: ${q}`;
                    fetchMovies(currentEndpoint, 1);
                } else if (q.length === 0) {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc';
                    sectionTitle.innerHTML = '<i class="fas fa-fire" style="color: var(--primary-color);"></i> الأفلام المتاحة للتشغيل';
                    fetchMovies(currentEndpoint, 1);
                }
            }, 500);
        });

        genresBar.addEventListener('click', (e) => {
            if (e.target.classList.contains('genre-btn')) {
                document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');

                const id = e.target.getAttribute('data-id');
                currentPage = 1;
                if (id === 'all') {
                    currentEndpoint = '/discover/movie?sort_by=popularity.desc';
                } else {
                    currentEndpoint = `/discover/movie?with_genres=${id}&sort_by=popularity.desc`;
                }
                fetchMovies(currentEndpoint, 1);
            }
        });

        loadMoreBtn.addEventListener('click', () => {
            currentPage++;
            fetchMovies(currentEndpoint, currentPage, true);
        });

        fetchMovies(currentEndpoint, 1);
    </script>
</body>
</html>
